# Blueprint Render. Root directory của service là thư mục 06-lab-complete.
# AGENT_API_KEY do Render tự sinh. REDIS_URL lấy từ Redis cùng blueprint, không ghi secret vào file.
services:
  - type: redis
    name: day14-redis
    plan: free
    ipAllowList: []
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DAILY_BUDGET_USD
        value: "1"
      - key: ENVIRONMENT
        value: staging
